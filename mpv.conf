# ===================== GPU =====================
vo=gpu-next
hwdec=nvdec
# ArtCNN 是计算着色器，走菜单换上去时需要 Vulkan。OpenGL 的 wayland 上下文编译失败后会把这支着色器关掉。
gpu-context=waylandvk
gpu-shader-cache=yes

# ===================== 画质 =====================
profile=high-quality
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# ===================== 超分 =====================
# 默认 Anime4K 极致，由 scripts/upscale.lua 在启动时挂上。
# Ctrl+1 开关，其他档位在右键「视频 > 超分模式」里选。

# ===================== HDR =====================
# 自动计算 HDR 视频峰值亮度
hdr-compute-peak=yes
# 色调映射算法
tone-mapping=bt.2446a
# 色调映射参数（平衡亮暗细节）
tone-mapping-param=1.0
# 显示器峰值亮度（按实际调整：400/600/800/1000）
target-peak=800
# 色域映射（避免 HDR 色彩溢出）
gamut-mapping-mode=desaturate

# ===================== 插帧 =====================
# 默认开启，Ctrl+` 开关。目标帧率在 frame-interpolation/rife.vpy 的 target_fps。
vf=vapoursynth=~~/frame-interpolation/rife.vpy

# ===================== 播放 =====================
# 退出时记住位置，下次从这里继续
save-position-on-quit=yes

# ===================== 界面：ModernGlass =====================
# 关掉内置 OSC，交给 scripts/modernz.lua。字幕和 OSD 边距不要写进 watch-later，
# 否则控制条收起后字幕仍停在被抬高的位置。
osc=no
watch-later-options-remove=sub-pos
watch-later-options-remove=osd-margin-y

# ===================== B站：弹幕 + 码率 =====================
# 弹幕：~~/scripts/bili-danmaku.lua 自动下载并挂轨，
#       缓存 ~/.cache/bili-danmaku/（默认 1 天过期），d 键开/关弹幕。
#       全部可调参数（字体/字号/停留时长/屏蔽规则/缓存天数等）见该脚本头部注释。
#
# 码率：cookies-from-browser=edge 必带，否则番剧等内容被限制在 480P；
#       ytdl-format 限定 h264（avc1），av1 档码率太低，放大后伪影明显；
#       format-sort=br 在 h264 + 1080P 上限内选码率最高的一条。
#       注意 ytdl-raw-options 以逗号分隔键值对，值里不能再出现逗号。
#
# 以上只对 B站 生效。若 cookie 读取失败导致无法播放，
# 删掉 cookies-from-browser=edge, 即降级为无登录。
[bili]
profile-cond=path:find("bilibili") ~= nil or path:find("b23%.tv") ~= nil or path:find("acg%.tv") ~= nil
ytdl-format=bv*[height<=1080][vcodec^=avc1]+ba/b
ytdl-raw-options=cookies-from-browser=edge,format-sort=br
