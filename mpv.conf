############ GPU
vo=gpu
hwdec=nvdec
gpu-context=wayland
#gpu-api=vulkan

############ 高画质
profile=gpu-hq
scale=ewa_lanczossharp
cscale=ewa_lanczossharp


############ Anime4K 默认模式 高性能模式 
glsl-shaders="~~/shaders/glsl/Deblur/Anime4K_Deblur_DoG.glsl:~~/shaders/glsl/Restore/Anime4K_Restore_CNN_M.glsl:~~/shaders/glsl/Upscale/Anime4K_Upscale_CNN_x2_L.glsl"

# ===================== HDR 自动开启配置 =====================
# 自动计算 HDR 视频峰值亮度（核心 HDR 适配参数）
hdr-compute-peak=yes
# HDR 色调映射算法（官方推荐，自动适配 HDR 视频）
tone-mapping=bt.2446a
# 色调映射参数（平衡亮暗细节）
tone-mapping-param=1.0
# 显示器峰值亮度（按实际调整：400/600/800/1000）
target-peak=800
# 色域映射（避免 HDR 色彩溢出，官方参数）
gamut-mapping-mode=desaturate
############ shader缓存
gpu-shader-cache=yes
##########插帧，默认开启
vf=vapoursynth=~~/rife.vpy
#########从上次退出位置继续播放
save-position-on-quit=yes

# ===================== B站：弹幕 + 码率 =====================
# 弹幕：脚本 ~/.config/mpv/scripts/bili-danmaku.lua 自动下载并挂轨，
#       缓存 ~/.cache/bili-danmaku/（默认 1 天过期），d 键 开/关弹幕。
#       全部可调参数（字体/字号/停留时长/屏蔽规则/缓存天数等）见该脚本头部注释。
#
# 码率：cookies-from-browser=edge 必带，否则番剧等内容被限制在 480P；
#       format-sort=br 在 1080P 上限内选码率最高的一条（不指定编码格式）。
#       注意 ytdl-raw-options 以逗号分隔键值对，值里不能再出现逗号。
#
# 以上只对 B站 生效。若 cookie 读取失败导致无法播放，
# 删掉 cookies-from-browser=edge, 即降级为无登录。
[bili]
profile-cond=path:find("bilibili") ~= nil or path:find("b23%.tv") ~= nil or path:find("bilibili%.tv") ~= nil or path:find("acg%.tv") ~= nil
ytdl-format=bv*[height<=1080][vcodec^=avc1]+ba/b
ytdl-raw-options=cookies-from-browser=edge,format-sort=br
