# 右键菜单由 menu-plugin 读取本文件里的 #menu:。
# 以 _ 开头的行只出现在菜单里，不占快捷键。
# Ctrl+1 开关超分，开的时候是 Anime4K 极致。其他档位只在右键菜单里选。
# Ctrl+` 仍是 RIFE，d 仍是 B 站弹幕，Ctrl+v 仍走 clipboard.lua。

Ctrl+o  script-message-to menu open               #menu: 打开 > 文件...
Ctrl+O  script-message-to menu open-folder        #menu: 打开 > 文件夹...
_       script-message-to dialog open append      #menu: 打开 > 添加到播放列表...
_       ignore                                    #menu: 打开 > -
_       script-message-to dialog open bd-iso      #menu: 打开 > 蓝光 ISO...
_       script-message-to dialog open dvd-iso     #menu: 打开 > DVD ISO...
_       ignore                                    #menu: 打开 > -
Ctrl+v  script-binding clipboard/play_from_clipboard #menu: 打开 > 剪贴板

SPACE   cycle pause                               #menu: 播放 #@state=(idle_active and 'disabled' or (pause or 'hidden'))
SPACE   cycle pause                               #menu: 暂停 #@state=((idle_active or pause) and 'hidden')
_       stop                                      #menu: 停止 #@state=(idle_active and 'disabled')
_       ignore                                    #menu: -
l       ab-loop                                   #menu: 播放 > 设置/清除 A-B 循环点
L       cycle-values loop-file inf no             #menu: 播放 > 切换循环播放

_       ignore                                    #menu: 轨道 #@tracks
_       ignore                                    #menu: 章节 #@chapters
_       ignore                                    #menu: 版本 #@editions
_       ignore                                    #menu: 播放列表 #@playlist

Right   seek  5                                   #menu: 导航 > 前进 5 秒
Left    seek -5                                   #menu: 导航 > 后退 5 秒
UP      seek  60                                  #menu: 导航 > 前进 1 分钟
DOWN    seek -60                                  #menu: 导航 > 后退 1 分钟
_       ignore                                    #menu: 导航 > -
PGUP    add chapter  1                            #menu: 导航 > 下一章节
PGDWN   add chapter -1                            #menu: 导航 > 上一章节
.       frame-step                                #menu: 导航 > 下一帧
,       frame-back-step                           #menu: 导航 > 上一帧
_       ignore                                    #menu: 导航 > -
>       playlist-next                             #menu: 导航 > 下个文件
<       playlist-prev                             #menu: 导航 > 上个文件

# 超分。用鼠标换档会把玻璃模糊着色器一起换掉，控制条收起后再出现时脚本会挂回去。
CTRL+1  script-binding sr/toggle                  #menu: 视频 > 超分模式 > 开关
_       script-binding sr/off                     #menu: 视频 > 超分模式 > 关闭
_       change-list glsl-shaders set "~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_S.glsl" #menu: 视频 > 超分模式 > Anime4K > 轻量
_       change-list glsl-shaders set "~~/shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_M.glsl:~~/shaders/Anime4K/glsl/Upscale/Anime4K_Upscale_CNN_x2_M.glsl" #menu: 视频 > 超分模式 > Anime4K > 推荐
_       script-binding sr/on                      #menu: 视频 > 超分模式 > Anime4K > 极致
_       change-list glsl-shaders set "~~/shaders/ArtCNN/GLSL/ArtCNN_C4F32.glsl"    #menu: 视频 > 超分模式 > ArtCNN > 中性
_       change-list glsl-shaders set "~~/shaders/ArtCNN/GLSL/ArtCNN_C4F32_DS.glsl" #menu: 视频 > 超分模式 > ArtCNN > 去噪锐化
_       change-list glsl-shaders set "~~/shaders/ArtCNN/GLSL/ArtCNN_C4F32_DN.glsl" #menu: 视频 > 超分模式 > ArtCNN > 去噪柔化
_       change-list glsl-shaders set "~~/shaders/ArtCNN/GLSL/ArtCNN_C4F16.glsl"    #menu: 视频 > 超分模式 > ArtCNN > 轻量

CTRL+`  vf toggle vapoursynth=~~/rife.vpy         #menu: 视频 > 插帧 RIFE

_       set hwdec nvdec; show-text "硬解: nvdec"   #menu: 视频 > 解码 > nvdec
_       set hwdec no; show-text "硬解: 关闭"       #menu: 视频 > 解码 > 软解
_       ignore                                    #menu: 视频 > -
_       add contrast -1                           #menu: 视频 > 调色 > 对比度 -1
_       add contrast  1                           #menu: 视频 > 调色 > 对比度 +1
_       add brightness -1                         #menu: 视频 > 调色 > 亮度 -1
_       add brightness  1                         #menu: 视频 > 调色 > 亮度 +1
_       add gamma -1                              #menu: 视频 > 调色 > 伽马 -1
_       add gamma  1                              #menu: 视频 > 调色 > 伽马 +1
_       add saturation -1                         #menu: 视频 > 调色 > 饱和度 -1
_       add saturation  1                         #menu: 视频 > 调色 > 饱和度 +1
_       add hue -1                                #menu: 视频 > 调色 > 色调 -1
_       add hue  1                                #menu: 视频 > 调色 > 色调 +1
_       ignore                                    #menu: 视频 > 调色 > -
_       set contrast 0; set brightness 0; set gamma 0; set saturation 0; set hue 0 #menu: 视频 > 调色 > 重置
_       cycle-values hdr-compute-peak yes no; show-text "HDR 动态映射:${hdr-compute-peak}" #menu: 视频 > HDR > 动态映射
_       cycle-values tone-mapping bt.2446a spline auto; show-text "HDR 映射:${tone-mapping}" #menu: 视频 > HDR > 映射曲线
Ctrl+r  cycle-values video-rotate 90 180 270 0    #menu: 视频 > 旋转
w       add panscan -0.1                          #menu: 视频 > 去黑边 -
W       add panscan  0.1                          #menu: 视频 > 去黑边 +
b       cycle deband                              #menu: 视频 > 去色带 #@state=(deband and 'checked')
_       cycle deinterlace                         #menu: 视频 > 反交错 #@state=(deinterlace and 'checked')
d       script-binding bili-danmaku/toggle-danmaku #menu: 视频 > B站弹幕

s       script-message-to modernz screenshot subtitles #menu: 视频 > 截屏
S       script-message-to modernz screenshot video     #menu: 视频 > 截屏（不包含字幕）

SHARP   cycle audio                               #menu: 音频 > 切换轨道 #@tracks/audio
_       script-message-to dialog open add-audio   #menu: 音频 > 加载文件... #@state=(idle_active and 'disabled')
_       ignore                                    #menu: 音频 > 输出设备 #@audio-devices
9       add volume -2                             #menu: 音量 > 降低
0       add volume  2                             #menu: 音量 > 增加
m       cycle mute                                #menu: 音量 > 静音 #@state=(mute and 'checked')
_       add audio-delay  0.1                      #menu: 音频 > 延迟 +0.1
_       add audio-delay -0.1                      #menu: 音频 > 延迟 -0.1

j       cycle sub                                 #menu: 字幕 > 主字幕 #@tracks/sub
v       cycle sub-visibility                      #menu: 字幕 > 主字幕 > 可见性 #@state=(sub_visibility and 'checked')
z       add sub-delay -0.1                        #menu: 字幕 > 主字幕 > 延迟 -0.1
Z       add sub-delay  0.1                        #menu: 字幕 > 主字幕 > 延迟 +0.1
r       add sub-pos -1                            #menu: 字幕 > 主字幕 > 上移
R       add sub-pos +1                            #menu: 字幕 > 主字幕 > 下移
_       script-message-to dialog open add-sub     #menu: 字幕 > 加载文件... #@state=(idle_active and 'disabled')
F       add sub-scale -0.1                        #menu: 字幕 > 字体 -
G       add sub-scale  0.1                        #menu: 字幕 > 字体 +

[       multiply speed 1/1.1                      #menu: 速度 > -10%
]       multiply speed 1.1                        #menu: 速度 > +10%
{       multiply speed 0.5                        #menu: 速度 > 减半
}       multiply speed 2.0                        #menu: 速度 > 翻倍
_       set speed 0.5                             #menu: 速度 > 0.5 倍
_       set speed 0.75                            #menu: 速度 > 0.75 倍
_       set speed 1.0                             #menu: 速度 > 1.0 倍
_       set speed 1.25                            #menu: 速度 > 1.25 倍
_       set speed 1.5                             #menu: 速度 > 1.5 倍
_       set speed 2.0                             #menu: 速度 > 2.0 倍
BS      set speed 1                               #menu: 速度 > 重置

o       show-progress                             #menu: 查看 > 显示进度
O       no-osd cycle-values osd-level 3 1         #menu: 查看 > OSD 时间轴
i       script-binding stats/display-stats        #menu: 查看 > 统计信息
`       script-binding console/enable             #menu: 查看 > 控制台

f       cycle fullscreen                          #menu: 窗口 > 全屏 #@state=(fullscreen and 'checked')
T       cycle ontop                               #menu: 窗口 > 置顶 #@state=(ontop and 'checked')
_       script-message-to dialog set-clipboard ${path} #menu: 工具 > 复制文件路径
_       ignore                                    #menu: 工具 > 配置文件 #@profiles

q       quit                                      #menu: 退出
Q       quit-watch-later                          #menu: 退出（记住位置）

MBTN_RIGHT script-message-to menu show
